version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: medonivo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-medonivo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-medonivopass}
      POSTGRES_DB: ${POSTGRES_DB:-medonivo_db}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-medonivo} -d ${POSTGRES_DB:-medonivo_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: medonivo-redis
    restart: unless-stopped
    ports:
      - '127.0.0.1:6379:6379'
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
